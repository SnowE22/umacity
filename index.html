<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UmaCity Reader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, sans-serif; }
    .active-tab { border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body class="pb-16 select-none text-xs">

  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur px-3 pt-2 pb-1.5 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="relative flex-1">
        <input id="searchInput" type="text" placeholder="Поиск по названию, тегу, автору..." 
               class="w-full pl-8 pr-3 py-1.5 bg-slate-800 rounded-lg text-xs border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-sky-500">
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <button onclick="openRandomComic()" class="px-2.5 py-1.5 bg-sky-500 rounded-lg text-white font-medium shadow active:scale-95">🎲</button>
      <button id="adminBtn" onclick="toggleAdminPrompt()" class="p-1.5 bg-slate-800 rounded-lg text-slate-400 border border-slate-700">🔒</button>
    </div>

    <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-800/60">
      <div class="flex gap-4 text-xs text-slate-400">
        <button id="tabChrono" onclick="switchTab('chrono')" class="py-1 active-tab">По порядку (ТГ)</button>
        <button id="tabChars" onclick="switchTab('characters')" class="py-1">По персонажам</button>
      </div>
      <div id="folderIndicator" class="hidden text-[11px] bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded flex items-center gap-1">
        <span id="folderLabel"></span>
        <button onclick="clearFolderFilter()" class="hover:text-white font-bold ml-1">✕</button>
      </div>
    </div>
  </header>

  <main class="p-2.5">
    <div id="comicsGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
    <div id="charsGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5 hidden"></div>
  </main>

  <div id="readerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
    <div class="p-2.5 bg-slate-900/90 backdrop-blur flex justify-between items-center border-b border-slate-800">
      <button onclick="closeReader()" class="text-sky-400 text-xs font-medium">← Назад</button>
      <div class="text-center truncate max-w-[200px] px-2">
        <div id="readerTitle" class="text-xs font-semibold text-white truncate"></div>
        <div id="readerSubTitle" class="text-[10px] text-slate-400 truncate"></div>
      </div>
      <a id="readerTgLink" href="#" target="_blank" class="text-xs text-sky-400 underline">В пост</a>
    </div>
    <div id="readerPages" class="flex-1 overflow-y-auto p-2 space-y-2 flex flex-col items-center"></div>
  </div>

  <div id="adminCharModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 p-4 rounded-xl w-full max-w-sm border border-slate-700">
      <h3 class="text-sm font-semibold mb-3">Редактировать персонажа</h3>
      <label class="block text-[11px] text-slate-400 mb-1">Имя (RU):</label>
      <input type="text" id="editCharName" class="w-full p-2 bg-slate-900 rounded-lg text-xs text-white border border-slate-700 mb-3">
      <label class="block text-[11px] text-slate-400 mb-1">Ссылка на аватарку:</label>
      <input type="text" id="editCharAvatar" class="w-full p-2 bg-slate-900 rounded-lg text-xs text-white border border-slate-700 mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeAdminCharModal()" class="px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300">Отмена</button>
        <button onclick="saveCharacterData()" class="px-3 py-1.5 rounded-lg bg-sky-500 text-white font-medium">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    const ADMIN_PIN = "7777";
    let isAdmin = localStorage.getItem("uma_is_admin") === "true";
    let customNames = JSON.parse(localStorage.getItem("uma_custom_names") || "{}");
    let customAvatars = JSON.parse(localStorage.getItem("uma_custom_avatars") || "{}");

    let allComics = [];
    let charactersList = [];
    let currentTab = "chrono";
    let activeCharFilter = null;
    let editingTag = null;

    function updateAdminBtnUI() {
      const btn = document.getElementById("adminBtn");
      btn.innerText = isAdmin ? "🔓" : "🔒";
      btn.className = isAdmin ? "p-1.5 bg-emerald-950 text-emerald-400 border border-emerald-700 rounded-lg" : "p-1.5 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg";
    }

    function toggleAdminPrompt() {
      if (isAdmin) {
        if (confirm("Выйти из админки?")) {
          isAdmin = false;
          localStorage.setItem("uma_is_admin", "false");
          updateAdminBtnUI();
          renderCurrentView();
        }
      } else {
        const pin = prompt("Введите PIN-код:");
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          localStorage.setItem("uma_is_admin", "true");
          updateAdminBtnUI();
          renderCurrentView();
        }
      }
    }

    async function loadData() {
      updateAdminBtnUI();
      try {
        const res = await fetch(`data.json?t=${Date.now()}`);
        const data = await res.json();
        allComics = data.comics;
        charactersList = data.characters;
        renderCurrentView();
      } catch (err) {
        console.error("Ошибка загрузки data.json", err);
      }
    }

    function switchTab(tab, charTag = null) {
      currentTab = tab;
      activeCharFilter = charTag;
      document.getElementById("tabChrono").className = tab === 'chrono' && !charTag ? 'py-1 active-tab' : 'py-1 text-slate-400';
      document.getElementById("tabChars").className = tab === 'characters' ? 'py-1 active-tab' : 'py-1 text-slate-400';

      const indicator = document.getElementById("folderIndicator");
      if (charTag) {
        const charObj = charactersList.find(c => c.tag === charTag);
        document.getElementById("folderLabel").innerText = `📁 ${customNames[charTag] || charObj?.name_ru || charTag}`;
        indicator.classList.remove("hidden");
      } else {
        indicator.classList.add("hidden");
      }
      renderCurrentView();
    }

    function clearFolderFilter() { switchTab('chrono', null); }

    function renderCurrentView() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim().replace('#', '');
      if (currentTab === 'characters' && !activeCharFilter) {
        document.getElementById("comicsGrid").classList.add("hidden");
        document.getElementById("charsGrid").classList.remove("hidden");
        renderCharacters(query);
      } else {
        document.getElementById("comicsGrid").classList.remove("hidden");
        document.getElementById("charsGrid").classList.add("hidden");
        renderComics(query);
      }
    }

    function renderComics(query) {
      const container = document.getElementById("comicsGrid");
      container.innerHTML = "";
      let list = allComics;

      if (activeCharFilter) {
        list = list.filter(c => c.primary_char === activeCharFilter || c.tags.includes(activeCharFilter));
      }
      if (query) {
        list = list.filter(c => 
          c.title.toLowerCase().includes(query) ||
          (customNames[c.primary_char] || c.primary_char_name).toLowerCase().includes(query) ||
          c.tags.some(t => t.includes(query)) ||
          (c.author && c.author.toLowerCase().includes(query))
        );
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">Ничего не найдено</div>`;
        return;
      }

      list.forEach(c => {
        const card = document.createElement("div");
        card.className = "bg-slate-800/90 rounded-lg overflow-hidden border border-slate-700/60 flex flex-col cursor-pointer active:scale-95 transition";
        card.onclick = () => openReader(c);

        const cover = c.images[0] || '';
        const name = customNames[c.primary_char] || c.primary_char_name;

        card.innerHTML = `
          <div class="aspect-[4/5] w-full bg-slate-950 relative overflow-hidden flex items-center justify-center p-0.5">
            ${cover ? `<img src="${cover}" class="w-full h-full object-cover rounded" loading="lazy">` : `<span class="text-[10px] text-slate-600">Комикс</span>`}
            <div class="absolute bottom-1 right-1 bg-black/80 px-1 rounded text-[9px] text-slate-200">
              ${c.images.length} стр.
            </div>
          </div>
          <div class="p-1.5 flex flex-col justify-between flex-1">
            <span class="text-[11px] font-medium text-slate-100 line-clamp-2 leading-tight">${c.title}</span>
            <div class="flex justify-between items-center mt-1 pt-1 border-t border-slate-700/40 text-[9px] text-slate-400">
              <span class="text-sky-400 truncate max-w-[65px]">${name}</span>
              <span>#${c.id}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCharacters(query) {
      const container = document.getElementById("charsGrid");
      container.innerHTML = "";
      let chars = [...charactersList].sort((a, b) => b.count - a.count);

      if (query) {
        chars = chars.filter(c => (customNames[c.tag] || c.name_ru).toLowerCase().includes(query) || c.tag.toLowerCase().includes(query));
      }

      chars.forEach(char => {
        const card = document.createElement("div");
        card.className = "bg-slate-800/80 rounded-xl p-2 border border-slate-700/60 flex flex-col items-center text-center cursor-pointer active:scale-95 transition relative";
        
        const avatar = customAvatars[char.tag] || char.avatar || 'https://via.placeholder.com/150';
        const name = customNames[char.tag] || char.name_ru;

        card.innerHTML = `
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden border-2 border-sky-400/60 mb-1.5 bg-slate-950 flex items-center justify-center">
            <img src="${avatar}" class="w-full h-full object-cover" loading="lazy">
          </div>
          <span class="text-[11px] font-semibold text-slate-100 line-clamp-1">${name}</span>
          <span class="text-[9px] text-sky-400 mt-0.5">${char.count} глав</span>
          ${isAdmin ? `
            <button onclick="event.stopPropagation(); openAdminCharModal('${char.tag}', '${name}', '${avatar}')" 
                    class="absolute top-1 right-1 p-1 bg-slate-900/90 rounded-md text-amber-400 text-[10px] border border-amber-500/30">✏️</button>
          ` : ''}
        `;
        card.onclick = () => switchTab('chrono', char.tag);
        container.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", renderCurrentView);

    function openRandomComic() {
      if (!allComics.length) return;
      openReader(allComics[Math.floor(Math.random() * allComics.length)]);
    }

    function openReader(comic) {
      const name = customNames[comic.primary_char] || comic.primary_char_name;
      document.getElementById("readerTitle").innerText = comic.title;
      document.getElementById("readerSubTitle").innerText = `${name} ${comic.author ? '• @' + comic.author : ''}`;
      document.getElementById("readerTgLink").href = `https://t.me/umacity/${comic.id}`;

      const pagesBox = document.getElementById("readerPages");
      pagesBox.innerHTML = "";

      comic.images.forEach((src, idx) => {
        const img = document.createElement("img");
        img.src = src;
        img.className = "max-w-full rounded-lg shadow-md";
        img.alt = `Стр. ${idx + 1}`;
        pagesBox.appendChild(img);
      });
      document.getElementById("readerModal").classList.remove("hidden");
    }

    function closeReader() { document.getElementById("readerModal").classList.add("hidden"); }

    function openAdminCharModal(tag, name, avatar) {
      editingTag = tag;
      document.getElementById("editCharName").value = name;
      document.getElementById("editCharAvatar").value = customAvatars[tag] || "";
      document.getElementById("adminCharModal").classList.remove("hidden");
    }

    function closeAdminCharModal() { document.getElementById("adminCharModal").classList.add("hidden"); }

    function saveCharacterData() {
      if (!editingTag) return;
      const newName = document.getElementById("editCharName").value.trim();
      const newAvatar = document.getElementById("editCharAvatar").value.trim();

      if (newName) customNames[editingTag] = newName;
      if (newAvatar) customAvatars[editingTag] = newAvatar;
      else delete customAvatars[editingTag];

      localStorage.setItem("uma_custom_names", JSON.stringify(customNames));
      localStorage.setItem("uma_custom_avatars", JSON.stringify(customAvatars));

      closeAdminCharModal();
      renderCurrentView();
    }

    loadData();
  </script>
</body>
</html>
